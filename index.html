<html lang="fr">
<head>
<meta charset="UTF-8">

<style>
:root{
  --bg:#0a0e1f; --bg2:#0e1330; --card:#131a3a; --bubble-ai:#161d40;
  --text:#eef0ff; --sub:#8b93c4; --accent1:#3fa9f5; --accent2:#a24bf0;
  --input-bg:#101636; --border:#232a55;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#f4f5fb; --bg2:#ffffff; --card:#ffffff; --bubble-ai:#eef0fb;
  --text:#141832; --sub:#5b6290; --accent1:#2f8de0; --accent2:#8a3ee0;
  --input-bg:#eef0fb; --border:#dfe2f5;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f5fb; --bg2:#ffffff; --card:#ffffff; --bubble-ai:#eef0fb;
    --text:#141832; --sub:#5b6290; --accent1:#2f8de0; --accent2:#8a3ee0;
    --input-bg:#eef0fb; --border:#dfe2f5;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; height:100%;
}
header{
  position:sticky; top:0; padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  background:var(--bg2); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; z-index:10;
}
.brand{display:flex; align-items:center; gap:10px}
.brand svg{width:26px;height:26px}
.brand span{font-weight:700; font-size:19px; letter-spacing:.2px}
.hdr-actions{display:flex; align-items:center; gap:8px; position:relative}
.icon-btn{
  width:36px;height:36px;border-radius:50%; border:1px solid var(--border);
  background:var(--card); color:var(--text); display:flex; align-items:center;
  justify-content:center; cursor:pointer; font-size:15px;
}
#agentLabel{font-size:12px; color:var(--sub); margin-right:2px; white-space:nowrap}
.menu{
  position:absolute; top:44px; right:0; background:var(--card);
  border:1px solid var(--border); border-radius:14px; padding:6px;
  min-width:170px; box-shadow:0 12px 30px rgba(0,0,0,.35); display:none; z-index:20;
}
.menu.open{display:block}
.menu button{
  width:100%; text-align:left; background:none; border:none; color:var(--text);
  padding:9px 10px; border-radius:9px; font-size:14.5px; cursor:pointer;
  display:flex; align-items:center; gap:9px;
}
.menu button:hover{background:var(--bubble-ai)}
.menu button.active{color:var(--accent1); font-weight:600}
main{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px}
.msg{max-width:88%; white-space:pre-wrap; word-break:break-word; padding:10px 14px; border-radius:16px; font-size:14.5px; line-height:1.4}
.msg.ai{align-self:flex-start; background:var(--bubble-ai); border-bottom-left-radius:4px}
.msg.user{align-self:flex-end; background:linear-gradient(135deg,var(--accent1),var(--accent2)); color:#fff; border-bottom-right-radius:4px}
.msg.pending{opacity:.6; font-style:italic}
.msg.sys{align-self:center; color:var(--sub); font-size:12.5px; text-align:center}
.md{white-space:normal}
.md h2,.md h3,.md h4,.md h5,.md h6{margin:10px 0 6px; line-height:1.3}
.md h2{font-size:17px} .md h3{font-size:15.5px} .md h4,.md h5,.md h6{font-size:14.5px}
.md p{margin:0 0 8px}
.md p:last-child{margin-bottom:0}
.md strong{font-weight:700} .md em{font-style:italic}
.md code{background:rgba(128,128,128,.22); padding:1px 5px; border-radius:5px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.92em}
.md ul,.md ol{margin:4px 0 8px; padding-left:22px}
.md li{margin:2px 0}
.md .tbl-wrap{overflow-x:auto; margin:8px 0; -webkit-overflow-scrolling:touch}
.md table{border-collapse:collapse; font-size:13px; min-width:100%}
.md th,.md td{border:1px solid var(--border); padding:5px 9px; text-align:left; white-space:nowrap}
.md th{background:rgba(128,128,128,.18); font-weight:700}
.actions{display:flex; gap:6px; margin-top:8px}
.act-btn{border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:14px; padding:3px 10px; font-size:12.5px; cursor:pointer}
.msg.pending .actions{display:none}
.typing{display:inline-flex; gap:4px; padding:4px 2px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--sub);animation:tyBounce 1.2s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes tyBounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.msg img.gen{max-width:100%; border-radius:12px; display:block; margin-top:4px}
#fichierChip{display:none; align-items:center; gap:6px; background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:5px 10px; font-size:12.5px; margin:0 14px 6px; color:var(--sub)}
#fichierChip.on{display:flex}
#fichierChip button{background:none; border:none; color:var(--sub); font-size:13px; cursor:pointer; margin-left:auto}
.fichier{margin:8px 0; border:1px solid var(--border); border-radius:12px; background:var(--card); padding:8px 10px; white-space:normal}
.fichier .nom{font-weight:600; font-size:13.5px; word-break:break-all}
.fichier .meta{color:var(--sub); font-size:12px; margin:2px 0 8px}
.fichier .btns{display:flex; gap:6px; flex-wrap:wrap}
#viewer{position:fixed; inset:0; z-index:100; background:#1e1e1e; color:#d4d4d4; display:none; flex-direction:column}
#viewer.open{display:flex}
#modeBar{display:flex; gap:8px; padding:6px 12px; background:var(--bg2); border-bottom:1px solid var(--border)}
#modeBar .pill{flex:1; border:1px solid var(--border); background:var(--card); color:var(--text,inherit); border-radius:999px; padding:6px 10px; font-size:12.5px; cursor:pointer}
#modeBar .pill.on{border-color:#3fb37f; box-shadow:0 0 0 1px #3fb37f inset}
#modeBar .pill.off{opacity:.65}
#modeBar .pill:disabled{opacity:.45; cursor:default}
#apercu{position:fixed; inset:0; z-index:110; background:#fff; display:none; flex-direction:column}
#apercu.open{display:flex}
#apercuBar{display:flex; align-items:center; gap:6px; padding:10px 12px; background:#2d2d2d; color:#fff; padding-top:max(10px, env(safe-area-inset-top))}
#apercuNom{flex:1; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; word-break:break-all}
#apercuBar .act-btn{background:#3c3c3c; color:#fff; border-color:#555}
#apercuFrame{flex:1; width:100%; border:0; background:#fff}
#viewerBar{display:flex; align-items:center; gap:8px; padding:10px 12px; background:#2d2d2d; color:#fff; padding-top:max(10px, env(safe-area-inset-top))}
#viewerNom{flex:1; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13.5px; word-break:break-all}
#viewerBar .lock{font-size:11.5px; color:#9cdcfe; white-space:nowrap}
#viewerBar .act-btn{background:#3c3c3c; color:#fff; border-color:#555}
#viewerCode{flex:1; overflow:auto; margin:0; padding:10px 0 24px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; line-height:1.55; -webkit-user-select:text; user-select:text}
.ligne{display:flex}
.ligne .num{flex:none; width:46px; text-align:right; padding-right:12px; color:#858585; -webkit-user-select:none; user-select:none}
.ligne .cod{white-space:pre; padding-right:16px}
footer{
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--bg2); border-top:1px solid var(--border);
  display:flex; align-items:center; gap:8px;
  transition:transform .12s ease;
}
#inputRow{
  flex:1; display:flex; align-items:center; background:var(--input-bg);
  border:1px solid var(--border); border-radius:22px; padding:6px 6px 6px 16px;
}
#inputRow textarea{flex:1; border:none; background:none; color:var(--text); font-size:14.5px; outline:none; resize:none; max-height:120px; font-family:inherit; line-height:1.4}
#inputRow textarea::placeholder{color:var(--sub)}
#sendBtn{
  width:34px;height:34px;border-radius:50%; border:none; cursor:pointer;
  background:linear-gradient(135deg,var(--accent1),var(--accent2)); color:#fff;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}

.brand{user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; cursor:default}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; z-index:50}
.overlay[hidden]{display:none}
.sheet{width:100%; max-width:520px; max-height:88%; overflow-y:auto; background:var(--bg2); color:var(--text);
  border:1px solid var(--border); border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.sheet input,.sheet select{width:100%; margin-top:8px; padding:10px 12px; font-size:15px; font-family:inherit;
  background:var(--input-bg); color:var(--text); border:1px solid var(--border); border-radius:10px}
.btn{margin-top:10px; padding:10px 14px; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer;
  background:linear-gradient(135deg,var(--accent1),var(--accent2)); color:#fff}
.btn.sec{background:var(--card); color:var(--text); border:1px solid var(--border)}
.row2{display:flex; gap:8px}
.row2 .btn{flex:1}
.hint{font-size:12.5px; color:var(--sub); margin:8px 0 0; min-height:16px}
.adm-item{border-top:1px solid var(--border); padding:8px 0; font-size:13px}
.adm-item b{color:var(--accent1)}
.adm-item button{float:right; background:none; border:none; color:#e0607a; font-size:12px; cursor:pointer}
</style>

// Anvoye yon konesans nouvo bay tout aparèy
async function pousseConnaissanceFirebase(agent, item){
  if(!db) return;
  try{ await db.collection("knowledge").doc(agent).collection("items").doc(item.id).set(item); }
  catch(e){ console.error("Firebase push:", e.message); }

// Rale konesans lòt moun te ajoute, mete yo nan KB si yo poko la
async function synchroniserConnaissances(){
  if(!db) return;
  for(const agent of Object.keys(KB)){
    try{
      const snap = await db.collection("knowledge").doc(agent).collection("items").get();
      const connus = new Set(KB[agent].map(x => x.id));
      snap.forEach(doc => { if(!connus.has(doc.id)) KB[agent].push(doc.data()); });

<script>
/* ---- Configuration du serveur relais (Render) ---- */
const PROXY_URL = "https://knall-1.onrender.com";
const APP_TOKEN = "Knall2026SecretXk9";
const $ = id => document.getElementById(id);
const _lire = (k, d) => { try{ const v = localStorage.getItem(k); return v === null ? d : v === "1"; }catch(e){ return d; } };
let MODE_EN_LIGNE = _lire("knall-online", true);   // true = avec internet, false = sans connexion (base locale seulement)
let BASE_LOCALE = _lire("knall-base", true);       // ma propre recherche (base locale) ON/OFF
const APPRENDRE = true; // sauvegarde les reponses du serveur dans la base locale

/* ---- Bases de connaissances locales, chargees depuis des fichiers JSON (un par agent) ---- */
let KB = {general:[], taches:[], code:[], recherche:[], redaction:[]};
/* Connaissances intégrées : servent si le dossier knowledge/ n'est pas sur le site */
const KB_INTEGREE = {"code": [{"id": "c001", "question": "comment faire une fonction en javascript", "reponse": "Voici un exemple de fonction :\n```javascript fonction.js\nfunction nom(param) {\n  return param;\n}\n```\nOn écrit le mot function, un nom, des paramètres entre parenthèses, puis le code entre accolades.", "tags": ["javascript", "fonction", "code"]}, {"id": "c002", "question": "comment centrer une div en css", "reponse": "Mets ceci sur le parent :\n```css centrer.css\n.parent {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n}\n```", "tags": ["css", "centrer", "div"]}, {"id": "c003", "question": "comment faire une page html simple", "reponse": "Voici une page HTML de base :\n```html page.html\n<!DOCTYPE html>\n<html lang=\"fr\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Ma page<\/title>\n<\/head>\n<body>\n  <h1>Bonjour<\/h1>\n  <a href=\"https://exemple.com\">Un lien<\/a>\n<\/body>\n<\/html>\n```", "tags": ["html", "page", "site", "base", "lien"]}], "general": [{"id": "g001", "question": "idée de repas rapide et sain", "reponse": "Bol de quinoa au poulet et légumes : quinoa, poulet grillé, avocat, tomates, concombre, sauce au citron.", "tags": ["repas", "cuisine", "manger"]}, {"id": "g002", "question": "comment redémarrer l'application", "reponse": "Ferme complètement Knall puis rouvre-le depuis l'icône.", "tags": ["redemarrer", "bug", "probleme"]}, {"id": "g003", "question": "qui es-tu", "reponse": "Je suis Knall, ton assistant qui fonctionne avec ou sans connexion internet.", "tags": ["knall", "qui", "identite"]}], "recherche": [{"id": "r001", "question": "meteo", "reponse": "La recherche web nécessite une connexion internet active.", "tags": ["meteo", "internet", "recherche"]}], "redaction": [{"id": "d001", "question": "comment faire une introduction", "reponse": "Une introduction a 4 temps : 1) accroche, 2) présentation du sujet, 3) problématique, 4) annonce du plan.", "tags": ["introduction", "dissertation", "plan"]}, {"id": "d002", "question": "comment faire une conclusion", "reponse": "Une conclusion a 2 temps : 1) bilan qui répond à la problématique, 2) ouverture vers une question proche.", "tags": ["conclusion", "dissertation"]}, {"id": "d003", "question": "connecteurs logiques", "reponse": "Addition : de plus, en outre. Opposition : cependant, pourtant. Cause : car, en effet. Conséquence : donc, ainsi. Conclusion : enfin, en somme.", "tags": ["connecteurs", "liaison", "mots"]}, {"id": "d004", "question": "quelle est la difference entre argument et exemple", "reponse": "L'argument est la raison qui appuie ton idée. L'exemple est le fait précis qui prouve cet argument.", "tags": ["argument", "exemple", "difference"]}], "taches": [{"id": "t001", "question": "créer un rappel", "reponse": "Dis-moi quoi et à quelle heure, ex: 'rappelle-moi d'appeler Marc à 15h'.", "tags": ["rappel", "reminder", "heure"]}, {"id": "t002", "question": "liste de mes tâches", "reponse": "Tu n'as aucune tâche enregistrée pour le moment.", "tags": ["taches", "liste", "todo"]}]};
async function chargerKB(){
  // Chaque agent a son dossier : knowledge/<agent>/ avec index.json (liste des fichiers) + fichiers .json
  for(const agent of Object.keys(KB)){
    const base = "knowledge/" + agent + "/";
    let fichiers = [];
    try{
      const ir = await fetch(base + "index.json");
      if(ir.ok) fichiers = (await ir.json()).map(f => base + f);
    }catch(e){ console.error("Index KB " + agent + ":", e.message); }
    if(!fichiers.length) fichiers = ["knowledge/" + agent + ".json"]; // ancien format (un seul fichier)
    const vus = new Set();
    for(const f of fichiers){
      try{
        const res = await fetch(f);
        if(!res.ok) continue;
        const items = await res.json();
        if(!Array.isArray(items)) continue;
        items.forEach((it, i) => {
          if(!it || typeof it.question !== "string" || typeof it.reponse !== "string") return;
          const id = it.id || (agent + "-" + f.split("/").pop() + "-" + i);
          if(vus.has(id)) return;
          vus.add(id);
          KB[agent].push({id, question: it.question, reponse: it.reponse, tags: Array.isArray(it.tags) ? it.tags : []});
        });
      }catch(e){ console.error("Chargement KB " + f + ":", e.message); }
    }
    if(!KB[agent].length && KB_INTEGREE[agent]) KB[agent].push(...KB_INTEGREE[agent]); // fichiers introuvables : connaissances intégrées
  }
}
const NOMS = {general:"Général", taches:"Tâches", code:"Code", recherche:"Recherche", redaction:"Rédaction"};
let agentActif = "general";

/* ---- Fils de conversation : chaque paj gen son tit ak son istwa a li ---- */
let threads = [];
let threadId = null;
function nouvelId(){ return "th" + Date.now() + Math.floor(Math.random()*1000); }
function videHist(){ return {general:[], taches:[], code:[], recherche:[], redaction:[]}; }
function chargerThreads(){
  try{ threads = JSON.parse(localStorage.getItem('knall-threads') || '[]'); }catch(e){ threads = []; }
  if(!threads.length){
    threads = [{id: nouvelId(), titre: "Nouvo konvèsasyon", agent: "general", vues: [], hist: videHist()}];

/* ---- MOTEUR (recherche + rédaction, 100% hors ligne) ---- */
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const STOP = new Set("les des une aux que qui pour par sur dans avec sans est sont pas plus comme mais donc car ont ete etre cette ces ses son mon ton tes mes nos vos leur leurs nous vous ils elles elle lui moi toi mwen nan ak epi yon tout comment faire fait quel quelle quels quoi kijan the and".split(" "));
const SYN = {bouffe:"repas",manger:"repas",mange:"repas",nourriture:"repas",dejeuner:"repas",diner:"repas",souper:"repas",erreur:"bug",probleme:"bug",panne:"bug",bloque:"bug",relancer:"redemarrer",relance:"redemarrer",reboot:"redemarrer",alarme:"rappel",rappeler:"rappel",tache:"taches",todo:"taches"};
const tok = s => norm(s).split(/[^a-z0-9]+/).filter(m => m.length > 2 && !STOP.has(m)).map(m => SYN[m] || m);
const rac = m => m.length > 5 ? m.slice(0,5) : m.replace(/[sx]$/,"");

function chercherReponse(question, base){
  const q = [...new Set(tok(question).map(rac))];
  if(!q.length) return null;
  let meilleur = null, best = 0;
  for(const item of base){
    const qs = new Set(tok(item.question).map(rac));
    const ts = new Set((item.tags || []).flatMap(t => tok(t)).map(rac));
    let score = 0;
    for(const m of q){ if(qs.has(m) || ts.has(m)) score++; }
    // reponses apprises du serveur (id "auto…") : seulement si la question est quasi identique
    if(String(item.id).startsWith("auto") && jac(new Set(q), qs) < 0.75) continue;
    if(score > best){ best = score; meilleur = item; }
  }
  const assez = q.length === 1 ? best === 1 : best >= 2;   // un seul mot en commun ne suffit plus
  return (assez && best / q.length >= 0.6) ? meilleur.reponse : null;
}

/* ---- Agent Rédaction ---- */
const CONNECT = ["d'abord","ensuite","de plus","en effet","cependant","pourtant","toutefois","donc","par consequent","en conclusion","enfin","ainsi","par ailleurs","or","car","mais","en outre","neanmoins","d'une part","d'autre part"];
const phrases = t => t.split(/(?<=[.!?…])\s+|\n+/).map(s => s.trim()).filter(Boolean);
const nbMots = t => (t.trim().match(/\S+/g) || []).length;
const jac = (a, b) => { const u = new Set([...a, ...b]); if(!u.size) return 0; let c = 0; a.forEach(x => { if(b.has(x)) c++; }); return c / u.size; };
const liste = (arr, max = 15) => arr.length ? arr.slice(0, max).join(", ") + (arr.length > max ? " … (+" + (arr.length - max) + ")" : "") : "—";
const reste = q => q.replace(/^\s*\S+\s*(?:(?:sur|de|du|des|d')\s*|:\s*)?/i, "").trim();

function comparer(a, b){
  const sa = new Set(tok(a)), sb = new Set(tok(b));
  if(!sa.size || !sb.size) return "Les deux textes doivent contenir plus de mots.";
  const com = [...sa].filter(x => sb.has(x)), ua = [...sa].filter(x => !sb.has(x)), ub = [...sb].filter(x => !sa.has(x));
  const sim = Math.round(100 * com.length / new Set([...sa, ...sb]).size);
  const verdict = sim >= 70 ? "textes très proches" : sim >= 40 ? "textes proches" : sim >= 20 ? "peu de points communs" : "textes très différents";
  const pa = phrases(a), pb = phrases(b), vusB = new Set();
  const lignes = pa.map((p, i) => {
    let bj = -1, bs = 0; const sp = new Set(tok(p));
    pb.forEach((q, j) => { const s = jac(sp, new Set(tok(q))); if(s > bs){ bs = s; bj = j; } });
    const pct = Math.round(bs * 100);
    if(pct >= 30) vusB.add(bj);
    return pct >= 60 ? "A" + (i+1) + " ≈ B" + (bj+1) + " (" + pct + " %) même idée"
         : pct >= 30 ? "A" + (i+1) + " ~ B" + (bj+1) + " (" + pct + " %) idée voisine"
         : "A" + (i+1) + " : idée absente de B";
  });
  pb.forEach((_, j) => { if(!vusB.has(j)) lignes.push("B" + (j+1) + " : idée absente de A"); });
  return "📊 COMPARAISON\nRessemblance : " + sim + " % — " + verdict +
    "\nLongueur : A " + nbMots(a) + " mots · B " + nbMots(b) + " mots" +
    "\n\n✅ En commun : " + liste(com) + "\n🅰️ Seulement dans A : " + liste(ua) + "\n🅱️ Seulement dans B : " + liste(ub) +
    "\n\n🔎 PHRASE PAR PHRASE\n" + lignes.join("\n");
}

function planDissertation(s){
  if(!s) return "Donne-moi le sujet. Ex : dissertation : l'éducation est-elle la clé du développement ?";
  return "📝 PLAN DE DISSERTATION\nSujet : " + s +
    "\n\nINTRODUCTION\n1. Accroche : un fait, une citation ou une question liée au sujet\n2. Présentation : définir les mots clés de « " + s + " »\n3. Problématique : une question précise qui découle du sujet\n4. Annonce du plan : dire les grandes parties" +
    "\n\nI. THÈSE (oui / arguments pour)\n• Argument 1 → explication → exemple\n• Argument 2 → explication → exemple\n→ Transition" +
    "\n\nII. ANTITHÈSE (non / limites)\n• Argument 1 → explication → exemple\n• Argument 2 → explication → exemple\n→ Transition" +
    "\n\nIII. SYNTHÈSE (dépasser l'opposition)\n• Position nuancée et justifiée\n• Exemple qui la confirme" +
    "\n\nCONCLUSION\n1. Bilan : répondre clairement à la problématique\n2. Ouverture : élargir vers une question proche";
}

function argumenter(s){
  if(!s) return "Donne-moi l'idée à défendre. Ex : argument : les jeunes doivent apprendre un métier.";
  return "💬 CONSTRUIRE UN ARGUMENT\nIdée à défendre : " + s +
    "\n\n1. Affirmation : dis clairement ta position (« Je pense que… »)\n2. Raison : pourquoi ? (« En effet, car… »)\n3. Preuve / exemple : un fait précis, un chiffre, un cas réel\n4. Objection : ce que l'autre pourrait répondre (« Certains diront que… »)\n5. Réfutation : pourquoi l'objection est faible (« Cependant… »)\n6. Conclusion : reformule (« Donc, ainsi… »)" +
    "\n\nConnecteurs utiles : d'abord, de plus, en effet, par ailleurs, cependant, en conclusion.";
}

function analyser(t){
  if(!t) return "Colle le texte après le mot analyse. Ex : analyse : ton texte ici";
  const ph = phrases(t), n = nbMots(t), mots = tok(t), freq = {};
  mots.forEach(m => freq[m] = (freq[m] || 0) + 1);
  const tri = Object.entries(freq).sort((x, y) => y[1] - x[1]);
  const rep = tri.filter(([, c]) => c >= 3).slice(0, 6).map(([m, c]) => m + " ×" + c);
  const cles = tri.slice(0, 8).map(([m]) => m);
  const nt = norm(t);
  const conn = CONNECT.filter(c => new RegExp("(^|[^a-z])" + norm(c).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "([^a-z]|$)").test(nt));
  const longues = ph.map((p, i) => [i + 1, nbMots(p)]).filter(([, k]) => k > 30).map(([i, k]) => "phrase " + i + " (" + k + " mots)");
  return "🔬 ANALYSE DU TEXTE\n" + n + " mots · " + ph.length + " phrase(s) · moyenne " + (ph.length ? Math.round(n / ph.length) : 0) + " mots/phrase" +
    "\n\n🔑 Mots clés : " + liste(cles) + "\n🔁 Répétitions : " + liste(rep) + "\n🔗 Connecteurs : " + liste(conn) +
    "\n📏 Phrases trop longues : " + liste(longues) +
    (conn.length < 2 ? "\n\n💡 Ajoute des connecteurs (de plus, cependant, donc) pour mieux enchaîner les idées." : "");
}

const AIDE_REDACTION = "✍️ AGENT RÉDACTION — commandes\n\n• compare : texte A ||| texte B\n• dissertation : ton sujet\n• argument : l'idée à défendre\n• analyse : ton texte\n\nSépare les deux textes avec |||";

function redaction(q){
  const n = norm(q).trim();
  if(/^(aide|ed|help|commandes?)\s*$/.test(n)) return AIDE_REDACTION;
  const cmdCompare = /^(compare|comparer|comparaison|konpare|konparezo|diferans|difference)/.test(n);
  if(cmdCompare || q.includes("|||")){
    const parts = (cmdCompare ? reste(q) : q).split(/\|\|\||###/).map(x => x.trim()).filter(Boolean);
    return parts.length >= 2 ? comparer(parts[0], parts[1]) : "Pour comparer, écris : compare : texte A ||| texte B";
  }
  if(/^(dissertation|disetasyon|plan)/.test(n)) return planDissertation(reste(q));
  if(/^(argument|agiman)/.test(n)) return argumenter(reste(q));
  if(/^(analyse|analyser|analiz)/.test(n)) return analyser(reste(q));
  return null;
}

  }

function detecterAgent(question, courant){
  const n = " " + norm(question).replace(/[^a-z0-9]+/g, " ") + " ";
  const sc = {general:0, code:0, taches:0, redaction:0, recherche:0};
  for(const ag in MOTS_AGENT){
    for(const poids in MOTS_AGENT[ag]){
      for(const kw of MOTS_AGENT[ag][poids]){
        const ok = kw[0] === "*" ? n.includes(" " + kw.slice(1)) : n.includes(" " + kw + " ");
        if(ok) sc[ag] += +poids;
      }
    }
  }
  if(question.includes("|||")) sc.redaction += 3;
  if(/\b\d{1,2}\s?h(\s?\d{2})?\b/i.test(question)) sc.taches += 1;
  if(/[{};<>]|=>|<\/|\bfunction\b/.test(question)) sc.code += 2;
  const cible = Object.keys(sc).sort((a, b) => sc[b] - sc[a])[0];
  const autre = Object.keys(sc).filter(a => a !== cible).map(a => sc[a]).sort((a, b) => b - a)[0];
  if(sc[cible] < 2 || sc[cible] <= autre) return null;       // pas assez sûr
  if(cible === courant) return null;
  if(sc[cible] < (sc[courant] || 0) + 2) return null;        // l'agent actuel colle presque autant : on reste
  return cible;
}

const EXT = {html:"html",htm:"html",javascript:"js",js:"js",jsx:"jsx",typescript:"ts",ts:"ts",json:"json",css:"css",python:"py",py:"py",php:"php",java:"java",sql:"sql",bash:"sh",sh:"sh",xml:"xml",markdown:"md",md:"md",kotlin:"kt",c:"c",cpp:"cpp",csharp:"cs",yaml:"yml",yml:"yml",text:"txt",txt:"txt"};
const MIMES = {html:"text/html", json:"application/json", css:"text/css", js:"text/javascript", xml:"application/xml", md:"text/markdown"};
function extraireCode(texte){
  if(((texte.match(/```/g) || []).length) % 2 === 1) texte += "\n```"; // reponse coupee : on ferme le bloc
  const segs = [], re = /```([^\n`]*)\n([\s\S]*?)```/g;
  let dernier = 0, m, n = 0;
  while((m = re.exec(texte))){
    let avant = texte.slice(dernier, m.index);
    const parts = m[1].trim().split(/\s+/).filter(Boolean);
    const langue = (parts[0] || "").toLowerCase();
    let nom = parts.find(x => /^[\w.-]+\.[a-z0-9]+$/i.test(x));
    if(!nom){ // titre juste avant le bloc : **index.html**
      const ls = avant.replace(/\s+$/, "").split("\n"), der = (ls[ls.length-1] || "").replace(/[*`#:_\s]/g, "");
      if(/^[\w.-]+\.[a-z0-9]{1,5}$/i.test(der)){ nom = der; ls.pop(); avant = ls.join("\n"); }
    }
    if(avant.trim()) segs.push({t:"texte", v:avant});
    n++;
    const ext = nom ? nom.split(".").pop().toLowerCase() : (EXT[langue] || "txt");
    if(!nom) nom = "knall-code-" + n + "." + ext;
    segs.push({t:"code", nom, ext, v:m[2].replace(/\n$/, "")});
    dernier = re.lastIndex;
  }
  if(dernier < texte.length) segs.push({t:"texte", v:texte.slice(dernier)});
  return segs;
}
async function telechargerFichier(nom, contenu, btn){
  const flash = t => { if(btn){ const o = btn.textContent; btn.textContent = t; setTimeout(() => btn.textContent = o, 1600); } };
  const P = window.Capacitor && window.Capacitor.Plugins;
  if(P && P.Filesystem && P.Share){ // app Android : on écrit le fichier puis on ouvre le choix "Ouvrir avec…"
    try{
      const r = await P.Filesystem.writeFile({path:nom, data:contenu, directory:"CACHE", encoding:"utf8"});
      await P.Share.share({title:nom, url:r.uri, dialogTitle:"Ouvrir avec…"});
      return;
    }catch(e){ if(e && /cancel/i.test(e.message || "")) return; }
  }
  try{ // navigateur : téléchargement classique
    const blob = new Blob([contenu], {type: MIMES[nom.split(".").pop().toLowerCase()] || "text/plain"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = nom;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    flash("✅ Téléchargé");
  }catch(e){ copierTexte(contenu, btn); }
}

/* ---- Aperçu visuel d'une app HTML (css/js des autres blocs du message intégrés) ---- */
function assemblerApp(seg, tous){
  const base = x => x.split("/").pop().toLowerCase();
  const csss = tous.filter(x => x.ext === "css"), jss = tous.filter(x => x.ext === "js");
  const utilises = new Set();
  const prendre = (liste, ref) => {
    let f = liste.find(x => base(x.nom) === base(ref));
    if(!f) f = liste.find(x => !utilises.has(x));
    if(f) utilises.add(f); return f;
  };
  let h = seg.v;
  h = h.replace(/<link\b[^>]*href=["']([^"']+\.css)["'][^>]*>/gi, (mm, ref) => {
    const f = prendre(csss, ref); return f ? "<style>\n" + f.v + "\n</style>" : mm;
  });
  h = h.replace(/<script\b[^>]*src=["']([^"']+\.js)["'][^>]*>\s*<\/script>/gi, (mm, ref) => {
    const f = prendre(jss, ref); return f ? "<script>\n" + f.v.replace(/<\/script/gi, "<\\/script") + "\n<\/script>" : mm;
  });
  csss.concat(jss).forEach(f => { // css/js sans balise dans le html : on les ajoute
    if(utilises.has(f)) return;
    const bloc = f.ext === "css" ? "<style>\n" + f.v + "\n</style>" : "<script>\n" + f.v.replace(/<\/script/gi, "<\\/script") + "\n<\/script>";
    h = /<\/body>/i.test(h) ? h.replace(/<\/body>/i, bloc + "\n</body>") : h + "\n" + bloc;
  });
  if(!/<meta[^>]+viewport/i.test(h)) h = h.replace(/<head[^>]*>/i, m => m + '<meta name="viewport" content="width=device-width, initial-scale=1">');
  return h;
}

/* ---- Rendu Markdown minimal (gras, titres, tableaux, listes) — 100% hors ligne ---- */
function escHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function inlineMd(s){
  s = escHtml(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`/g, "");  // backtick isole (reponse coupee)
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  return s;
}
function ligneTable(l){
  let c = l.trim(); if(c.startsWith("|")) c = c.slice(1); if(c.endsWith("|")) c = c.slice(0,-1);
  return c.split("|").map(x => x.trim());
}
function renduMarkdown(texte){
  const lignes = texte.replace(/\r\n/g,"\n").split("\n");
  let html = "", i = 0;
  while(i < lignes.length){
    const l = lignes[i];
    if(l.trim() === ""){ i++; continue; }
    // tableau : ligne d'en-tete + ligne de separation ---|---
    if(/^\s*\|.*\|\s*$/.test(l) && lignes[i+1] && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lignes[i+1])){
      const ent = ligneTable(l); i += 2;
      const corps = [];
      while(i < lignes.length && /^\s*\|.*\|\s*$/.test(lignes[i])){ corps.push(ligneTable(lignes[i])); i++; }
      html += '<div class="tbl-wrap"><table><thead><tr>' + ent.map(h => "<th>"+inlineMd(h)+"</th>").join("") +
        "</tr></thead><tbody>" + corps.map(r => "<tr>"+r.map(c => "<td>"+inlineMd(c||"")+"</td>").join("")+"</tr>").join("") +
        "</tbody></table></div>";
      continue;
    }
    // titres
    const hm = l.match(/^(#{1,4})\s+(.*)/);
    if(hm){ const n = hm[1].length + 2; html += "<h"+n+">"+inlineMd(hm[2])+"</h"+n+">"; i++; continue; }
    // listes
    if(/^\s*[-*•]\s+/.test(l) || /^\s*\d+[.)]\s+/.test(l)){
      const ord = /^\s*\d+[.)]\s+/.test(l), items = [];
      while(i < lignes.length && (/^\s*[-*•]\s+/.test(lignes[i]) || /^\s*\d+[.)]\s+/.test(lignes[i]))){
        items.push(lignes[i].replace(/^\s*(?:[-*•]|\d+[.)])\s+/, "")); i++;
      }
      const tag = ord ? "ol" : "ul";
      html += "<"+tag+">" + items.map(it => "<li>"+inlineMd(it)+"</li>").join("") + "</"+tag+">";
      continue;
    }
    // paragraphe (accumule les lignes simples qui se suivent)
    const para = [l]; i++;
    while(i < lignes.length && lignes[i].trim() !== "" && !/^\s*\|/.test(lignes[i]) && !/^#{1,4}\s/.test(lignes[i]) &&
          !/^\s*[-*•]\s+/.test(lignes[i]) && !/^\s*\d+[.)]\s+/.test(lignes[i])){
      para.push(lignes[i]); i++;
    }
    html += "<p>" + para.map(inlineMd).join("<br>") + "</p>";
  }
  return html;
}

async function repondre(question){
  if(DECLENCHEUR_IMAGE.test(question.trim())){
    if(!MODE_EN_LIGNE){ ajouterMsg("ai", "📴 Mode sans connexion : la génération d'image a besoin d'internet. Passe en ligne avec le bouton en haut."); return; }
    const prompt = question.replace(DECLENCHEUR_IMAGE, "").trim() || question;
    await genererImage(prompt);
    return;
  }
  if(ROUTAGE_AUTO){ const cible = detecterAgent(question, agentActif); if(cible) changerAgent(cible, true); }
  const agent = agentActif;
  // 0) agent Rédaction : outils de texte hors ligne
  if(agent === "redaction"){ const rr = redaction(question); if(rr){ ajouterMsg("ai", rr); memoriser(agent, question, rr); return; } }
  // 1) base locale
  const local = (BASE_LOCALE || !MODE_EN_LIGNE) ? chercherReponse(question, KB[agent] || []) : null;
  if(local){ ajouterMsg("ai", local); memoriser(agent, question, local); return; }
  // 2) serveur (si configure et en ligne)
  if(!MODE_EN_LIGNE){ ajouterMsg("ai", "📴 Mode sans connexion : je n'ai pas de réponse dans ma base pour ça. Passe en ligne (bouton en haut) pour interroger le serveur."); memoriser(agent, question, "(pas de réponse locale)"); return; }
  if(!PROXY_URL){ ajouterMsg("ai", "Rien dans la base locale, et le serveur n'est pas encore configuré (PROXY_URL en haut du script)."); return; }
  if(!navigator.onLine){ ajouterMsg("ai", "Pas de connexion et pas de réponse dans la base locale. (Le modèle offline viendra ici plus tard.)"); return; }
  const bulle = ajouterMsg("ai", "…"); // ajoute deja une entree "…" dans vues, on la corrige apres
  bulle.classList.add("pending");
  bulle.querySelector(".txt").innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  try{
    const rep = await appelerServeur(agent, question);
    remplirMsg(bulle, rep);
    bulle.classList.remove("pending");
    const v = threadActif().vues; v[v.length-1].texte = rep;
    memoriser(agent, question, rep);
    if(APPRENDRE) sauverAppris(agent, question, rep);
  }catch(e){
    bulle.classList.remove("pending");
    const msg = "Impossible de joindre le serveur : " + (e.name === "AbortError" ? "délai dépassé" : e.message);
    remplirMsg(bulle, msg);
    const v = threadActif().vues; v[v.length-1].texte = msg;
    sauverThreads();
  }
  chat.scrollTop = chat.scrollHeight;
}

  });
};

/* ---- Réglages : avec/sans connexion + base locale ON/OFF ---- */
function majModes(){
  const n = $('modeNet'), b = $('modeBase');
  n.textContent = MODE_EN_LIGNE ? '🌐 Avec internet' : '📴 Sans connexion';
  n.className = 'pill ' + (MODE_EN_LIGNE ? 'on' : 'off');
  const baseActive = BASE_LOCALE || !MODE_EN_LIGNE;   // hors ligne : la base locale est obligatoire
  b.textContent = '📚 Ma base : ' + (baseActive ? 'ON' : 'OFF');
  b.className = 'pill ' + (baseActive ? 'on' : 'off');
  b.disabled = !MODE_EN_LIGNE;
  try{ localStorage.setItem('knall-online', MODE_EN_LIGNE ? '1' : '0'); localStorage.setItem('knall-base', BASE_LOCALE ? '1' : '0'); }catch(e){}
}
$('modeNet').onclick = () => { MODE_EN_LIGNE = !MODE_EN_LIGNE; majModes(); ajouterMsg('sys', MODE_EN_LIGNE ? '🌐 Avec internet : le serveur répond quand ma base ne sait pas.' : '📴 Sans connexion : je réponds seulement avec ma base locale.'); };
$('modeBase').onclick = () => { BASE_LOCALE = !BASE_LOCALE; majModes(); ajouterMsg('sys', BASE_LOCALE ? '📚 Ma base : ON — je cherche d\'abord dans mes connaissances.' : '📚 Ma base : OFF — toutes les questions vont directement au serveur.'); };
majModes();
</script>
